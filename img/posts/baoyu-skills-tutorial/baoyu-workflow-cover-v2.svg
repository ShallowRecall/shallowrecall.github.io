<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">宝玉 Skills：从 Markdown 到内容工作流</title>
  <desc id="desc">原创教程封面，以采集、整理、配图、压缩、人工验收五个模块展示内容工作流。奶油色背景、深蓝文字、青绿和珊瑚色点缀。</desc>
  <defs>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172E46}
      .label{font-size:23px;letter-spacing:3px}.step{font-size:36px;font-weight:700}.sub{font-size:23px;fill:#526473}
      .line{fill:none;stroke:#172E46;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F3E9"/>
  <path d="M88 78H1512" stroke="#172E46" stroke-width="2"/>
  <rect x="88" y="110" width="10" height="27" fill="#168879"/>
  <text x="116" y="133" class="label">内容创作 · 实践教程</text>
  <text x="1512" y="133" text-anchor="end" class="label">WORKFLOW / 01</text>
  <text x="82" y="310" font-size="120" font-weight="700" letter-spacing="-3">宝玉 Skills</text>
  <text x="88" y="402" font-size="51" font-weight="500">从 Markdown 到内容工作流</text>
  <text x="91" y="469" font-size="27" fill="#526473">把重复步骤交给工具，把最终判断留给自己。</text>
  <g transform="translate(1110 195)">
    <circle cx="180" cy="136" r="150" fill="#E1ECE4"/>
    <rect x="82" y="35" width="207" height="246" rx="9" fill="#172E46" transform="rotate(10 185 158)"/>
    <rect x="40" y="14" width="207" height="246" rx="9" fill="#FFFDF7" stroke="#172E46" stroke-width="3" transform="rotate(-6 143 137)"/>
    <path d="M80 77H193M80 99H163M80 122H188" class="line"/>
    <rect x="76" y="153" width="126" height="66" rx="5" fill="#168879"/>
    <path d="M89 202L115 175L135 193L158 169L188 202" fill="none" stroke="#FFFDF7" stroke-width="4"/>
    <circle cx="262" cy="33" r="31" fill="#E7836C"/>
    <path d="M247 33L258 44L278 23" fill="none" stroke="#172E46" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(88 574)">
    <rect width="272" height="205" rx="14" fill="#E3EDE6"/>
    <text x="24" y="39" font-size="20" fill="#168879">01 / COLLECT</text>
    <path d="M211 42V82M195 66L211 82L227 66M191 94H231" class="line"/>
    <text x="24" y="113" class="step">采集</text>
    <text x="24" y="164" class="sub">网页与原始资料</text>
  </g>
  <g transform="translate(376 574)">
    <rect width="272" height="205" rx="14" fill="#FFFDF7" stroke="#D9DCD3"/>
    <text x="24" y="39" font-size="20">02 / ORGANIZE</text>
    <path d="M198 44H232M198 62H224M198 80H232" class="line"/>
    <text x="24" y="113" class="step">整理</text>
    <text x="24" y="164" class="sub">Markdown 与结构</text>
  </g>
  <g transform="translate(664 574)">
    <rect width="272" height="205" rx="14" fill="#FFFDF7" stroke="#D9DCD3"/>
    <text x="24" y="39" font-size="20">03 / VISUALIZE</text>
    <rect x="194" y="44" width="42" height="37" rx="3" class="line"/>
    <path d="M199 75L211 62L221 71L230 60" class="line"/>
    <text x="24" y="113" class="step">配图</text>
    <text x="24" y="164" class="sub">按表达目标选图</text>
  </g>
  <g transform="translate(952 574)">
    <rect width="272" height="205" rx="14" fill="#FFFDF7" stroke="#D9DCD3"/>
    <text x="24" y="39" font-size="20">04 / OPTIMIZE</text>
    <path d="M193 46L209 62M193 62H209V46M235 81L219 65M219 81V65H235" class="line"/>
    <text x="24" y="113" class="step">压缩</text>
    <text x="24" y="164" class="sub">格式、尺寸与体积</text>
  </g>
  <g transform="translate(1240 574)">
    <rect width="272" height="205" rx="14" fill="#F4DCD2"/>
    <text x="24" y="39" font-size="20">05 / REVIEW</text>
    <circle cx="218" cy="63" r="22" class="line"/>
    <path d="M207 63L215 71L230 55" class="line"/>
    <text x="24" y="113" class="step">人工验收</text>
    <text x="24" y="164" class="sub">事实、版权与效果</text>
  </g>
  <path d="M88 829H1512" stroke="#D1D7CF" stroke-width="2"/>
  <text x="88" y="864" font-size="21" fill="#526473">原创示意 · 非官方界面</text>
  <text x="1512" y="864" text-anchor="end" font-size="21" fill="#526473">工具负责执行，人负责确认</text>
</svg>
