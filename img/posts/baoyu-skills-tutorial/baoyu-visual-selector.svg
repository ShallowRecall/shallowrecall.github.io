<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">宝玉 Skills 视觉形式选择器</title>
  <desc id="desc">三列比较 SVG 技术关系图、知识卡片连续阅读、幻灯片逐页讲述，配有原创简约示意图和适用目标。</desc>
  <defs>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172E46}.head{font-size:30px;font-weight:700}.body{font-size:22px;fill:#526473}.small{font-size:19px;fill:#526473}.tag{font-size:18px;letter-spacing:2px;fill:#168879}
      .ink{fill:none;stroke:#172E46;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F3E9"/>
  <rect x="64" y="64" width="9" height="31" fill="#168879"/>
  <text x="91" y="94" font-size="25" letter-spacing="3">VISUAL SELECTOR / BAOYU SKILLS</text>
  <text x="64" y="184" font-size="59" font-weight="700">先选表达目标，再选视觉形式</text>
  <text x="66" y="240" font-size="27" fill="#526473">三种原创示意，不是官方截图；关键在于读者怎样理解信息。</text>
  <path d="M66 290H1534" stroke="#D1D7CF" stroke-width="2"/>
  <g transform="translate(66 344)">
    <rect width="466" height="448" rx="16" fill="#E3EDE6"/>
    <text x="34" y="52" class="tag">01 / RELATION</text>
    <text x="34" y="101" class="head">SVG 技术关系图</text>
    <text x="34" y="140" class="body">让节点、依赖和方向一眼可见</text>
    <rect x="34" y="173" width="398" height="172" rx="10" fill="#FFFDF7" stroke="#B9CEC1"/>
    <path d="M118 235H208M268 235H348M238 265V278H213V285" class="ink"/>
    <circle cx="88" cy="235" r="30" fill="#168879"/><circle cx="238" cy="235" r="30" fill="#E7836C"/><circle cx="378" cy="235" r="30" fill="#172E46"/>
    <text x="88" y="242" font-size="20" text-anchor="middle" style="fill:#FFFDF7">A</text><text x="238" y="242" font-size="20" text-anchor="middle" fill="#172E46">B</text><text x="378" y="242" font-size="20" text-anchor="middle" style="fill:#FFFDF7">C</text>
    <rect x="183" y="285" width="60" height="33" rx="5" fill="#F4DCD2" stroke="#BD604D"/><text x="213" y="308" font-size="18" text-anchor="middle">D</text>
    <text x="34" y="386" class="head" font-size="25">适用目标</text>
    <text x="34" y="423" class="body">架构、流程、数据流、依赖关系</text>
  </g>
  <g transform="translate(567 344)">
    <rect width="466" height="448" rx="16" fill="#FFFDF7" stroke="#D1D7CF"/>
    <text x="34" y="52" class="tag">02 / READING</text>
    <text x="34" y="101" class="head">知识卡片连续阅读</text>
    <text x="34" y="140" class="body">把一个观点拆成可滑动的节奏</text>
    <rect x="34" y="173" width="398" height="172" rx="10" fill="#F7F3E9" stroke="#D9DCD3"/>
    <rect x="72" y="204" width="104" height="105" rx="8" fill="#E3EDE6" stroke="#168879" stroke-width="2"/><rect x="198" y="204" width="104" height="105" rx="8" fill="#F4DCD2" stroke="#BD604D" stroke-width="2"/><rect x="324" y="204" width="70" height="105" rx="8" fill="#172E46"/>
    <path d="M88 227H159M88 246H150M88 265H136" stroke="#168879" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="240" r="23" fill="#FFFDF7"/><path d="M239 240L247 248L263 231" class="ink"/><path d="M339 231H379M339 249H370M339 267H379" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
    <text x="34" y="386" class="head" font-size="25">适用目标</text>
    <text x="34" y="423" class="body">概念解释、方法清单、社交传播</text>
  </g>
  <g transform="translate(1068 344)">
    <rect width="466" height="448" rx="16" fill="#172E46"/>
    <text x="34" y="52" class="tag" style="fill:#B9E2D9">03 / PRESENT</text>
    <text x="34" y="101" class="head" style="fill:#FFFDF7">幻灯片逐页讲述</text>
    <text x="34" y="140" class="body" style="fill:#C6D2D7">让每一页只承担一个叙事动作</text>
    <rect x="34" y="173" width="398" height="172" rx="10" fill="#26435A" stroke="#4F7382"/>
    <rect x="60" y="215" width="104" height="66" rx="5" fill="#FFFDF7"/><rect x="181" y="215" width="104" height="66" rx="5" fill="#E3EDE6"/><rect x="302" y="215" width="104" height="66" rx="5" fill="#F4DCD2"/>
    <path d="M74 232H148M74 249H128M74 266H138" stroke="#172E46" stroke-width="4" stroke-linecap="round"/><circle cx="233" cy="248" r="23" fill="#168879"/><path d="M222 248L230 256L246 238" stroke="#FFFDF7" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M319 262L351 229L387 262Z" fill="#BD604D"/>
    <g font-size="17" text-anchor="middle" style="fill:#C6D2D7"><text x="112" y="314" style="fill:#FFFDF7">01 / 引入</text><text x="233" y="314" style="fill:#FFFDF7">02 / 论证</text><text x="354" y="314" style="fill:#FFFDF7">03 / 总结</text></g>
    <text x="34" y="386" class="head" font-size="25" style="fill:#FFFDF7">适用目标</text>
    <text x="34" y="423" class="body" style="fill:#C6D2D7">课程、汇报、演示与分段叙事</text>
  </g>
  <text x="66" y="847" font-size="22" fill="#526473">选择提示：关系优先看 SVG，连续阅读看卡片，逐页讲述看幻灯片。</text>
  <text x="1534" y="847" text-anchor="end" font-size="22" fill="#526473">原创示意 · 形式服务于内容</text>
</svg>
